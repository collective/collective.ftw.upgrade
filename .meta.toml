# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.13.1"

[github]
jobs = [
   "qa",
#   "coverage",
#   "dependencies",
#   "release_ready",
   "circular",
]

[pyproject]
codespell_ignores = "requestor,"
dependencies_mappings = [
    """'Plone' = [
        'AccessControl',
        'Acquisition',
        'App',
        'BTrees',
        'lxml',
        'OFS',
        'persistent',
        'plone.app.contenttypes',
        'plone.app.intid',
        'plone.app.relationfield',
        'plone.app.textfield',
        'plone.app.uuid',
        'plone.base',
        'plone.browserlayer',
        'plone.dexterity',
        'plone.namedfile',
        'plone.portlets',
        'plone.protect',
        'plone.registry',
        'plone.uuid',
        'Products.BTreeFolder2',
        'Products.CMFCore',
        'Products.CMFPlacefulWorkflow',
        'Products.CMFPlone',
        'Products.GenericSetup',
        'Products.SiteAccess',
        'Products.ZCatalog',
        'transaction',
        'z3c.relationfield',
        'zExceptions',
        'zope.annotation',
        'zope.browser',
        'zope.component',
        'zope.configuration',
        'zope.container',
        'zope.deprecation',
        'zope.event',
        'zope.globalrequest',
        'zope.interface',
        'zope.intid',
        'zope.keyreference',
        'zope.lifecycleevent',
        'zope.publisher',
        'zope.schema',
        'zope.security',
        'ZPublisher',
    ]
    'plone.app.testing' = [
        'plone.testing',
    ]
    """,
]
dependencies_ignores = "['blessed','cgi','distutils','other.package']"
extra_lines = """
[tool.zest-releaser]
python-file-with-version = "src/collective/ftw/upgrade/__init__.py"
"""

[tox.constraints_files]
# The first entry is also the default for tox -e test, coverage and QA.
"6.3" = "https://dist.plone.org/release/6.3-dev/constraints.txt"
"6.2" = "https://dist.plone.org/release/6.2-latest/constraints.txt"

[tox.test_matrix]
"6.3" = ["3.15", "3.12"]
"6.2" = ["3.14", "3.13", "3.11"]

[gitignore]
extra_lines = """
/.mxdev_cache
"""
